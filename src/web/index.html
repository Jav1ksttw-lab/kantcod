<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15243a">
    <title>Прозрачная вакансия</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
</head>
<body>
    <header class="masthead">
        <div class="container masthead-inner">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <span>Прозрачная вакансия</span>
            </div>
            <span class="region">Калининградская область</span>
        </div>
    </header>
    <main class="container">
        <div class="intro">
            <div>
                <h1>Проверка вакансий</h1>
                <p>Замечания к условиям работы и вопросы работодателям.</p>
            </div>
            <div class="actions">
                <input id="report-file" type="file" accept=".json,application/json" hidden>
                <button id="upload" class="button" type="button">Открыть отчёт</button>
                <button id="download" class="button primary" type="button" disabled>Скачать JSON</button>
            </div>
        </div>

        <p id="notice" class="notice" role="status" hidden></p>
        <p id="loading" class="notice" role="status">Загружаем отчёт…</p>
        <div id="report" hidden>
            <div class="overview">
                <dl aria-label="Итоги проверки" class="metrics">
                    <div><dt>Вакансии</dt><dd id="total"></dd></div>
                    <div><dt>С замечаниями</dt><dd id="flagged"></dd></div>
                    <div><dt>Замечания</dt><dd id="finding-count"></dd></div>
                    <div><dt>Подтверждено ИИ</dt><dd id="ai-count"></dd></div>
                </dl>
                <p class="metadata" id="metadata"></p>
            </div>
            <div class="workspace">
                <section class="vacancies panel" aria-labelledby="list-title">
                    <div class="list-header">
                        <h2 id="list-title">Вакансии</h2>
                        <label class="search">
                            <span class="sr-only">Поиск вакансий</span>
                            <span aria-hidden="true" class="search-icon"></span>
                            <input type="search" id="search" placeholder="Должность, работодатель или ID" autocomplete="off">
                        </label>
                        <div role="group" aria-label="Фильтр по замечаниям" class="filters" id="filters">
                            <button type="button" data-filter="all" aria-pressed="true">Все</button>
                            <button type="button" data-filter="flagged" aria-pressed="false">С замечаниями</button>
                            <button type="button" data-filter="clear" aria-pressed="false">Без замечаний</button>
                        </div>
                    </div>
                    <ul id="vacancies" class="vacancy-list"></ul>
                    <p id="no-results" class="list-empty" role="status" hidden></p>
                </section>
                <section class="details panel" aria-label="Выбранная вакансия" id="details"></section>
            </div>
        </div>
        <p id="feedback" class="sr-only" role="status"></p>
    </main>
</body>
</html>
