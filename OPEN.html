<html lang="ru">
<head>

    <style>
:root {
    color-scheme: light;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    font-size: 100%;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-width: 0; line-height: 1.5; }
button, input { font: inherit; }
button { cursor: pointer; }
a { color: var(--accent-dark); text-underline-offset: .2em; }
:focus-visible { outline: 3px solid #3d73dc; outline-offset: 3px; }
h1, h2, h3, p, dl, dd, blockquote { margin: 0; }
.sr-only {
    position: absolute;
    inline-size: 1px;
    block-size: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
}

.container { max-width: 1344px; padding-inline: 36px; margin-inline: auto; }
.masthead { background: #15243a; color: #fff; }
.masthead-inner { display: flex; min-height: 64px; align-items: center; justify-content: space-between; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 1.0625rem; font-weight: 650; }
.brand-mark {
    width: 27px;
    height: 30px;
    flex: none;
    position: relative;
    border-radius: 5px;
    background: #83a8ff;
}
.brand-mark::before, .brand-mark::after {
    content: "";
    position: absolute;
    left: 6px;
    height: 2px;
    border-radius: 2px;
    background: #15243a;
}
.brand-mark::before { top: 9px; width: 15px; box-shadow: 0 5px #15243a; }
.brand-mark::after { top: 19px; width: 10px; }
.region { color: #cbd5e6; text-align: right; font-size: .875rem; }

main { padding-block: 39px 48px; }
.intro { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 26px; }
h1 { font-size: clamp(1.875rem, 3.1vw, 2.625rem); letter-spacing: -.04em; line-height: 1.15; }
.intro p { color: var(--muted); margin-top: 8px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.button {

    color: var(--ink);

    font-size: .875rem;
    font-weight: 650;
    white-space: nowrap;
}
.button:hover:enabled { background: #edf2f9; }
.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.primary:hover:enabled { background: var(--accent-dark); }
.button:disabled { cursor: default; opacity: .55; }

.overview { margin-bottom: 18px; }
.metrics {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
}
.metrics > div { padding: 15px 21px 16px; min-width: 0; }
.metrics > div + div { border-left: 1px solid var(--line); }
.metrics dt { font-size: .875rem; color: var(--muted); }
.metrics dd { font-size: 1.875rem; line-height: 1.15; margin-top: 5px; font-weight: 650; font-variant-numeric: tabular-nums; }
.metadata { margin-top: 9px; color: var(--muted); font-size: .875rem; overflow-wrap: anywhere; }
.notice {
    border-radius: 8px;
    background: #eaf0fc;
    color: #24437b;
    padding: 12px 15px;
    margin-block: 0 16px;
    overflow-wrap: anywhere;
}
.notice.warning { background: #fff1d9; color: #713f10; }

.workspace { display: grid; grid-template-columns: minmax(350px, .86fr) minmax(0, 1.2fr); gap: 18px; align-items: start; }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.list-header { padding: 17px 18px 12px; border-bottom: 1px solid var(--line); }
h2 { font-size: 1.1875rem; font-weight: 680; letter-spacing: -.018em; }
.search { display: flex; align-items: center; gap: 10px; margin-top: 12px; border: 1px solid #ccd6e4; border-radius: 7px; padding-inline: 12px; }
.search:focus-within { border-color: #3d73dc; box-shadow: 0 0 0 2px #d9e5fd; }
.search-icon { width: 13px; height: 13px; flex: none; position: relative; border: 1.6px solid #5c6b82; border-radius: 50%; margin-right: 3px; }
.search-icon::after { content: ""; width: 6px; height: 1.6px; background: #5c6b82; position: absolute; left: 8px; top: 9px; transform: rotate(45deg); }
.search input { width: 100%; min-width: 0; border: 0; background: transparent; padding: 8px 0; outline: none; color: var(--ink); font-size: .875rem; }
.search input::placeholder { color: #63728a; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.filters button { border: 0; border-radius: 6px; padding: 5px 8px; font-size: .875rem; background: transparent; color: var(--muted); }
.filters button:hover { background: #f0f4fa; }
.filters button[aria-pressed="true"] { background: #e8efff; color: #173e92; font-weight: 650; }
.vacancy-list { list-style: none; margin: 0; padding: 0; max-height: 515px; overflow-y: auto; }
.vacancy-list li + li { border-top: 1px solid #e9edf3; }
.vacancy-list li:last-child .vacancy { border-radius: 0 0 9px 9px; }
.vacancy {

    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    width: 100%;
    text-align: left;
    border: 0;
    border-left: 3px solid transparent;
    padding: 11px 15px;
    background: #fff;
    color: var(--ink);

.vacancy:hover { background: #f7f9fc; }
.vacancy[aria-current="true"] { border-left-color: var(--accent); background: #edf3ff; }
.vacancy:focus-visible { outline-offset: -3px; }
.vacancy-name { font-weight: 650; display: block; overflow-wrap: anywhere; }
.vacancy-employer { display: block; color: var(--muted); font-size: .8125rem; margin-top: 2px; overflow-wrap: anywhere; }
.count, .kind {
    border-radius: 5px;
    background: #eef2f7;
    color: #3c4f6b;
    padding: 3px 8px;
    font-size: .8125rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
}
.count { min-width: 28px; text-align: center; }
.count.clear { background: #e8f4ee; color: #206043; }
.list-empty { padding: 21px 18px; color: var(--muted); }

.detail-header { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); }
.detail-kicker { font-size: .8125rem; color: var(--muted); margin-bottom: 4px; overflow-wrap: anywhere; }

.detail-meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 4px 12px; margin-top: 9px; font-size: .875rem; color: var(--muted); }
.detail-meta a { white-space: nowrap; }
.findings { list-style: none; margin: 0; padding: 0 22px; }
.finding { padding: 17px 0 18px; overflow-wrap: anywhere; }
.finding + .finding { border-top: 1px solid var(--line); }
.finding-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.finding h3 { font-size: 1.0625rem; margin-right: 3px; }
.kind.omission { color: #76460a; background: #fff0d9; }
.kind.ambiguity { color: #234775; background: #e8f0ff; }
.kind.contradiction { color: #8b3030; background: #fbeded; }
.kind.ai { color: #4e5264; background: #eef1f6; }
.issue { margin-top: 7px; color: #3b4b63; }
.evidence { margin-top: 11px; padding: 8px 12px; background: #f4f7fb; border-left: 2px solid #9ab6e6; }
.evidence.conflict { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.evidence-label { color: var(--muted); font-size: .8125rem; }
.evidence blockquote { margin-top: 2px; font-weight: 550; }
.recommendation { display: flex; justify-content: space-between; align-items: flex-start; gap: 13px; margin-top: 13px; }
.recommendation p { margin-top: 2px; }
.copy { flex: none; min-height: 35px; padding: 5px 9px; }
.detail-empty { padding: 21px 22px; color: var(--muted); }
.detail-empty strong { color: #225e43; display: block; margin-bottom: 4px; }

@media (max-width: 925px) {
    .container { padding-inline: 22px; }
    .workspace { grid-template-columns: minmax(315px, .92fr) minmax(0, 1fr); gap: 12px; }
    .detail-header, .findings { padding-inline: 16px; }
    .recommendation { flex-wrap: wrap; }
}
@media (max-width: 700px) {
    main { padding-block: 26px 30px; }
    .container { padding-inline: 16px; }
    .intro { align-items: flex-start; flex-direction: column; gap: 14px; margin-bottom: 18px; }
    .masthead-inner { min-height: 58px; }
    .workspace { grid-template-columns: minmax(0, 1fr); }
    .vacancy-list { max-height: 300px; }
    .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metrics > div:nth-child(3) { border-left: 0; }
    .metrics > div:nth-child(n+3) { border-top: 1px solid var(--line); }
    .metrics > div { padding: 10px 14px; }
    .metrics dd { font-size: 1.65rem; }
}
@media (max-width: 390px) {
    .region { display: none; }
    .evidence.conflict { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .filters { gap: 3px; }
    .filters button { padding-inline: 6px; }
}
</style>

<script>
"use strict";

const kindLabels = {
    omission: "Не указано",
    ambiguity: "Нужно уточнить",
    contradiction: "Противоречие",
};

const fieldLabels = new Map([
    ["job-name", "Название должности"],
    ["duty", "Обязанности"],
    ["requirements", "Требования"],
    ["qualification", "Квалификация"],
    ["requirement.qualification", "Квалификация"],
    ["requirement.education", "Образование"],
    ["salary", "Описание оплаты"],
    ["salary_min", "Минимальная оплата"],
    ["salary_max", "Максимальная оплата"],
    ["schedule", "График"],
    ["shift", "Смены"],
    ["term.text", "Условия"],
    ["conditions", "Условия"],
    ["addresses.address[].location", "Адрес"],
    ["employment", "Занятость"],
]);

const get = (id) => document.getElementById(id);
const number = new Intl.NumberFormat("ru-RU");
const date = new Intl.DateTimeFormat("ru-RU", {
    dateStyle: "medium",
    timeStyle: "short",
    timeZone: "Europe/Kaliningrad",
});
const plural = new Intl.PluralRules("ru-RU");
const state = { report: null, demo: false, selected: null, filter: "all" };
let revision = 0;

function make(tag, className, content) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (content !== undefined) element.textContent = content;
    return element;
}

function hasText(value) {
    return typeof value === "string" && value.trim().length > 0;
}

function caption(vacancy) {
    return hasText(vacancy.title) ? vacancy.title : `Вакансия ${vacancy.id}`;
}

function titleCase(value) {
    return value[0].toLocaleUpperCase("ru") + value.slice(1);
}

function formatFindings(count) {
    const word = { one: "замечание", few: "замечания", many: "замечаний", other: "замечаний" };
    return `${number.format(count)} ${word[plural.select(count)]}`;
}

function setNotice(text, warning = false) {
    const notice = get("notice");
    notice.textContent = text;
    notice.hidden = !text;
    notice.classList.toggle("warning", warning);
}

function validReport(report) {
    return Boolean(report && Array.isArray(report.vacancies) && report.vacancies.every((vacancy) =>
        vacancy && (hasText(vacancy.id) || typeof vacancy.id === "number") &&
        Array.isArray(vacancy.findings) && vacancy.findings.every((finding) =>
            finding && ["kind", "topic", "field", "issue", "recommendation"].every((name) => hasText(finding[name]))
        )
    ));
}

function updateOverview(fileName) {
    const { report, demo } = state;
    const findings = report.vacancies.flatMap((vacancy) => vacancy.findings);
    const flagged = report.vacancies.filter((vacancy) => vacancy.findings.length > 0).length;
    get("total").textContent = number.format(report.vacancies.length);
    get("flagged").textContent = number.format(flagged);
    get("finding-count").textContent = number.format(findings.length);
    get("ai-count").textContent = number.format(findings.filter((finding) => finding.origin === "ai").length);
    const label = demo
        ? "Учебный отчёт"
        : (fileName || (["manual", "scheduled"].includes(report.mode) ? "Работа в России" : "Локальный отчёт"));
    const generated = new Date(report.generated_at);
    const model = report.ai?.model;
    const ai = model && model !== "none" ? model : "Проверка по правилам";
    get("metadata").textContent = [
        label,
        Number.isFinite(generated.getTime()) ? `${date.format(generated)} (Калининград)` : "",
        ai,
    ].filter(Boolean).join(" · ");
    const counts = { all: report.vacancies.length, flagged, clear: report.vacancies.length - flagged };
    for (const button of get("filters").querySelectorAll("button")) {
        const names = { all: "Все", flagged: "С замечаниями", clear: "Без замечаний" };
        button.textContent = `${names[button.dataset.filter]} ${number.format(counts[button.dataset.filter])}`;
    }
}

function selectVacancy(vacancy, focusDetails = false) {
    state.selected = vacancy;
    get("vacancies").querySelectorAll("button").forEach((button) => {
        if (button.dataset.id === String(vacancy.id)) button.setAttribute("aria-current", "true");
        else button.removeAttribute("aria-current");
    });
    renderDetails();
    if (focusDetails && window.matchMedia("(max-width: 700px)").matches) {
        get("details").querySelector("h2")?.focus();
    }
}

function renderList() {
    if (!state.report) return;
    const query = get("search").value.trim().toLocaleLowerCase("ru");
    const rows = state.report.vacancies.filter((vacancy) => {
        if (state.filter === "flagged" && !vacancy.findings.length) return false;
        if (state.filter === "clear" && vacancy.findings.length) return false;
        return [vacancy.title, vacancy.employer, vacancy.id]
            .some((value) => String(value ?? "").toLocaleLowerCase("ru").includes(query));
    });
    if (!rows.includes(state.selected)) state.selected = rows[0] ?? null;

    const list = get("vacancies");
    const fragment = document.createDocumentFragment();
    for (const vacancy of rows) {
        const row = make("li");
        const button = make("button", "vacancy");
        button.type = "button";
        button.dataset.id = String(vacancy.id);
        button.setAttribute("aria-controls", "details");
        if (vacancy === state.selected) button.setAttribute("aria-current", "true");
        const label = make("span");
        label.append(make("span", "vacancy-name", caption(vacancy)));
        if (hasText(vacancy.employer)) label.append(make("span", "vacancy-employer", vacancy.employer));
        const count = vacancy.findings.length;
        const badge = make("span", count ? "count" : "count clear", number.format(count));
        badge.setAttribute("aria-hidden", "true");
        button.append(label, badge, make("span", "sr-only", formatFindings(count)));
        button.addEventListener("click", () => selectVacancy(vacancy, true));
        row.append(button);
        fragment.append(row);
    }
    list.replaceChildren(fragment);
    const empty = get("no-results");
    empty.hidden = rows.length > 0;
    empty.textContent = state.report.vacancies.length ? "Вакансии не найдены." : "В отчёте нет вакансий.";
    for (const button of get("filters").querySelectorAll("button")) {
        button.setAttribute("aria-pressed", String(button.dataset.filter === state.filter));
    }
    renderDetails();
}

function portalUrl(value) {
    if (state.demo || !hasText(value)) return null;
    try {
        const url = new URL(value);
        return ["https:", "http:"].includes(url.protocol) ? url.href : null;
    } catch {
        return null;
    }
}

function quote(text, field, index) {
    const block = make("div");
    const label = fieldLabels.get(field) || field || `Поле ${index + 1}`;
    block.append(make("div", "evidence-label", label), make("blockquote", "", text));
    return block;
}

async function copyQuestion(text) {
    try {
        await navigator.clipboard.writeText(text);
    } catch {
        const previousFocus = document.activeElement;
        const field = make("textarea", "sr-only");
        field.value = text;
        field.readOnly = true;
        document.body.append(field);
        field.focus({ preventScroll: true });
        field.select();
        try {
            if (!document.execCommand("copy")) throw new Error("Копирование недоступно");
        } finally {
            field.remove();
            previousFocus?.focus({ preventScroll: true });
        }
    }
}

function findingItem(finding) {
    const item = make("li", "finding");
    const head = make("div", "finding-top");
    head.append(make("h3", "", titleCase(finding.topic)));
    if (Object.hasOwn(kindLabels, finding.kind)) {
        head.append(make("span", `kind ${finding.kind}`, kindLabels[finding.kind]));
    }
    if (finding.origin === "ai") head.append(make("span", "kind ai", "Подтвердил ИИ"));
    item.append(head, make("p", "issue", finding.issue));

    if (finding.kind === "contradiction" && Array.isArray(finding.values) && finding.values.length === 2) {
        const evidence = make("div", "evidence conflict");
        finding.values.forEach((value, index) => {
            evidence.append(quote(value, finding.value_fields?.[index] || (index === 0 ? finding.field : ""), index));
        });
        item.append(evidence);
    } else if (hasText(finding.quote)) {
        const evidence = make("div", "evidence");
        evidence.append(quote(finding.quote, finding.field, 0));
        item.append(evidence);
    }

    const next = make("div", "recommendation");
    const text = make("div");
    text.append(make("div", "evidence-label", "Вопрос работодателю"), make("p", "", finding.recommendation));
    const copy = make("button", "button copy", "Копировать");
    copy.type = "button";
    copy.setAttribute("aria-label", `Копировать вопрос · ${finding.topic}`);
    copy.addEventListener("click", async () => {
        try {
            await copyQuestion(finding.recommendation);
            copy.textContent = "Скопировано";
            get("feedback").textContent = "Вопрос скопирован.";
        } catch {
            copy.textContent = "Не скопировано";
            get("feedback").textContent = "Не удалось скопировать вопрос. Выделите его вручную.";
        }
    });
    next.append(text, copy);
    item.append(next);
    return item;
}

function renderDetails() {
    const panel = get("details");
    const vacancy = state.selected;
    if (!vacancy) {
        panel.hidden = true;
        panel.replaceChildren();
        return;
    }

    panel.hidden = false;
    const header = make("div", "detail-header");
    header.append(make("p", "detail-kicker", `ID ${vacancy.id}`));
    const title = make("h2", "", caption(vacancy));
    title.tabIndex = -1;
    header.append(title);
    const meta = make("div", "detail-meta");
    if (hasText(vacancy.employer)) meta.append(make("span", "", vacancy.employer));
    const url = portalUrl(vacancy.url);
    if (url) {
        const link = make("a", "", "Карточка на портале");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        meta.append(link);
    }
    if (meta.childElementCount) header.append(meta);
    panel.replaceChildren(header);

    if (vacancy.findings.length) {
        const list = make("ul", "findings");
        for (const finding of vacancy.findings) list.append(findingItem(finding));
        panel.append(list);
    } else {
        const empty = make("p", "detail-empty");
        empty.append(make("strong", "", "Замечаний нет"), "По результатам этой проверки уточнений не требуется.");
        panel.append(empty);
    }
}

function openReport(report, { demo = false, stale = false, fileName = "" } = {}) {
    if (!validReport(report)) throw new Error("В файле нет списка вакансий с замечаниями.");
    Object.assign(state, { report, demo, selected: null, filter: "all" });
    get("search").value = "";
    updateOverview(fileName);
    renderList();
    get("report").hidden = false;
    get("download").disabled = false;
    const message = stale ? "Последнее обновление завершилось ошибкой. Открыт сохранённый отчёт."
        : Number(report.stats?.ai_errors) > 0 ? "Часть проверок ИИ завершилась ошибкой. Подробности есть в JSON." : "";
    setNotice(message, Boolean(message));
}

async function openSavedReport() {
    const current = ++revision;
    try {
        const embedded = get("embedded-report");
        if (embedded) {
            const payload = JSON.parse(embedded.textContent);
            openReport(payload.report, payload);
            return;
        }
        const response = await fetch("./api/report");
        if (!response.ok) throw new Error("Отчёт недоступен");
        const payload = await response.json();
        if (current === revision) openReport(payload.report, payload);
    } catch {
        if (current === revision) setNotice("Не удалось открыть сохранённый отчёт. Выберите готовый JSON.", true);
    } finally {
        if (current === revision) get("loading").hidden = true;
    }
}

get("search").addEventListener("input", renderList);
get("filters").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-filter]");
    if (!button) return;
    state.filter = button.dataset.filter;
    renderList();
});
get("upload").addEventListener("click", () => get("report-file").click());
get("report-file").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const current = ++revision;
    try {
        const report = JSON.parse((await file.text()).replace(/^\uFEFF/, ""));
        if (current === revision) openReport(report, { fileName: file.name });
    } catch {
        if (current === revision) setNotice("Выберите JSON-отчёт команды run или verify.", true);
    } finally {
        event.target.value = "";
        if (current === revision) get("loading").hidden = true;
    }
});
get("download").addEventListener("click", () => {
    if (!state.report) return;
    const file = new Blob([JSON.stringify(state.report, null, 2) + "\n"], { type: "application/json" });
    const url = URL.createObjectURL(file);
    const link = make("a");
    link.href = url;
    link.download = "vacancy-report.json";
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
});

openSavedReport();
</script>
</body>
</html>
